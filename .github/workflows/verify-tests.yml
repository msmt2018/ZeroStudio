name: Verify Android Tests

# APK build must complete successfully before any verification tasks start.
on:
  workflow_run:
    workflows:
      - Build Android APK
    - Build Android APK (CLI) & publish draft release
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  tests:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NDK_VERSION: "29.0.14206865"
      ZEROSTUDIO_SKIP_NYX: "true"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx5g -XX:MaxMetaspaceSize=1g' -Dorg.gradle.daemon=false"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"

    steps:
      - name: Checkout the exact commit that produced the APK
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive

      - name: Install basic system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip protobuf-compiler python3 python3-pip wget curl

      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Configure Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platforms;android-35" "ndk;$NDK_VERSION" "cmake;3.22.1" "cmake;3.31.1"
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          grep -F "Pkg.Revision = $NDK_VERSION" "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Install CMake 3.31.1 via pip
        run: |
          sudo pip3 install cmake==3.31.1 --break-system-packages
          CMAKE_DATA_DIR=$(python3 -c "import cmake, os; print(os.path.join(os.path.dirname(cmake.__file__), 'data'))")
          echo "cmake.dir=$CMAKE_DATA_DIR" >> local.properties
          cmake --version
          protoc --version
          python3 --version

      - name: Build required native test dependencies
        run: |
          bash core/git/lib_build_scripts/build_native_libs.sh
          find core/git/src/main/jniLibs -name "*.so" -type f | sort

      - name: Grant wrapper execution permission
        run: chmod +x ./gradlew

      - name: Run JVM unit tests and Gradle verification
        run: |
          set +e
          status=0
          run_gradle() {
            echo "::group::Running: $*"
            "$@"
            result=$?
            echo "::endgroup::"
            if [ "$result" -ne 0 ]; then status=1; fi
          }
          run_gradle ./gradlew --no-daemon --max-workers=2 --continue check test testDebugUnitTest testReleaseUnitTest
          run_gradle ./gradlew -p composite-builds/build-deps --no-daemon --max-workers=2 --continue check test testDebugUnitTest testReleaseUnitTest
          run_gradle ./gradlew -p composite-builds/build-logic --no-daemon --max-workers=2 --continue check test
          exit "$status"

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            status=0
            run_gradle() {
              echo "::group::Instrumentation: $*"
              "$@"
              result=$?
              echo "::endgroup::"
              if [ "$result" -ne 0 ]; then status=1; fi
            }
            run_gradle ./gradlew --no-daemon --max-workers=2 --continue connectedCheck connectedDebugAndroidTest connectedReleaseAndroidTest
            run_gradle ./gradlew -p composite-builds/build-deps --no-daemon --max-workers=2 --continue connectedCheck connectedDebugAndroidTest connectedReleaseAndroidTest
            exit "$status"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zerostudio-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            **/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: warn
          retention-days: 14
