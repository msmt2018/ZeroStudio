name: Build Android APK

on:
  push:
    branches:
      - main
      - cleanup/remove-treesitter-format-provider-editor-lsp
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose the compilation type (assembleDebug or assembleRelease)'
        required: true
        default: 'assemble'
        type: choice
        options:
          - assemble
          - assembleDebug
          - assembleRelease

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NDK_VERSION: "29.0.14206865"

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install basic system dependency packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip protobuf-compiler python3 python3-pip wget curl

      - name: Configure JDK 21 (Zulu 21.0.9)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Configuring a Gradle 9.6.0 environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version

      - name: Verify Bun
        run: |
          which bun
          bun --version

      - name: Install web-ui dependencies with Bun
        working-directory: core/chatai/web-ui
        run: |
          bun install --frozen-lockfile

      - name: Install NDK r29 and Android SDK CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses

          # Install the canonical Android API 37 platform package.
          "$SDKMANAGER" --install "platforms;android-37.1" "build-tools;37.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1" "cmake;3.31.1"

          # Install API 37.1 for the app and colorpicker AAR metadata requirement; retain 37.0 for base API modules.

          # Fail immediately if the requested NDK revision was not installed exactly.
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          grep -F "Pkg.Revision = $NDK_VERSION" "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"


          echo "=== Installed Android SDK platforms ==="
          ls -la "$ANDROID_HOME/platforms"
          test -f "$ANDROID_HOME/platforms/android-37.1/android.jar"

      - name: Install CMake 3.31.1 via pip
        run: |
          sudo pip3 install cmake==3.31.1 --break-system-packages
          CMAKE_DATA_DIR=$(python3 -c "import cmake, os; print(os.path.join(os.path.dirname(cmake.__file__), 'data'))")
          echo "cmake.dir=$CMAKE_DATA_DIR" >> local.properties

          cmake --version
          protoc --version
          python3 --version

      - name: Build puppygit native libs (libcrypto, libssl, libssh2, libgit2)
        run: |
          bash core/git/lib_build_scripts/build_native_libs.sh
          echo "=== Built .so files ==="
          find core/git/src/main/jniLibs -name "*.so" -type f | sort

      - name: Grant execution permissions to the Gradle wrapper
        run: chmod +x ./gradlew

      - name: Compile APK
        env:
          # APK CI 不生成 Nyx 发布版本元数据；跳过 Nyx 插件，避免 Maven Central 限流导致构建中断
          ZEROSTUDIO_SKIP_NYX: "true"
          # 限制 Gradle JVM 最大使用 5GB 内存，不开启守护进程以免内存驻留
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx5g -XX:MaxMetaspaceSize=1g' -Dorg.gradle.daemon=false"
          # 限制 CMake 底层的 Ninja 并发数为 2，防止 C++ 编译器吃光内存

          # export CMAKE_BUILD_PARALLEL_LEVEL=2
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          # 使用 --max-workers=2 限制模块并发；保留完整 Gradle 输出供失败诊断。
          set -o pipefail
          BUILD_TYPE='${{ github.event.inputs.build_type || 'assemble' }}'
          echo "Building APK variant: $BUILD_TYPE"
          ./gradlew "$BUILD_TYPE" --build-cache --max-workers=2 --console=plain 2>&1 | tee build-apk-gradle.log

      - name: Upload APK build diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-diagnostic-log
          path: build-apk-gradle.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload app-arm64-v8a-release.apk
        if: github.event_name == 'push' || github.event.inputs.build_type == 'assembleRelease' || github.event.inputs.build_type == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release.apk
          path: core/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          compression-level: 0

      - name: Upload app-armeabi-v7a-release.apk
        if: github.event_name == 'push' || github.event.inputs.build_type == 'assembleRelease' || github.event.inputs.build_type == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release.apk
          path: core/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          compression-level: 0

      - name: Upload app-x86_64-release.apk
        if: github.event_name == 'push' || github.event.inputs.build_type == 'assembleRelease' || github.event.inputs.build_type == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release.apk
          path: core/app/build/outputs/apk/release/app-x86_64-release.apk
          compression-level: 0

      - name: Upload app-arm64-v8a-debug.apk
        if: github.event_name == 'push' || github.event.inputs.build_type == 'assembleDebug' || github.event.inputs.build_type == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug.apk
          path: core/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          compression-level: 0

      - name: Upload app-armeabi-v7a-debug.apk
        if: github.event_name == 'push' || github.event.inputs.build_type == 'assembleDebug' || github.event.inputs.build_type == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-debug.apk
          path: core/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          compression-level: 0

      - name: Upload app-x86_64-debug.apk
        if: github.event_name == 'push' || github.event.inputs.build_type == 'assembleDebug' || github.event.inputs.build_type == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-debug.apk
          path: core/app/build/outputs/apk/debug/app-x86_64-debug.apk
          compression-level: 0

  # Verification is a separate job node and starts only after the APK job succeeds.
  tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NDK_VERSION: "29.0.14206865"
      ZEROSTUDIO_SKIP_NYX: "true"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx5g -XX:MaxMetaspaceSize=1g' -Dorg.gradle.daemon=false"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - name: Checkout the exact commit that produced the APK
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Install basic system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip protobuf-compiler python3 python3-pip wget curl

      # The web module's preBuild invokes pnpm run build. Recreate the exact
      # Node/Bun toolchain used by the APK job before any Android test task.
      - name: Setup Bun for web UI tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js for web UI tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm for web UI tests
        run: |
          npm install --global pnpm
          pnpm --version

      - name: Install web UI dependencies for test build
        working-directory: core/chatai/web-ui
        run: bun install --frozen-lockfile

      # Keep test verification focused on executable tests. Repository-wide
      # Android lint currently contains unrelated baseline violations; those
      # must not be conflated with JVM/unit-test failures.
      # Run the repository build and lint tasks on the same JDK as the APK job.
      - name: Configure JDK 21 for project tests
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      # The Tooling API compatibility fixture launches Gradle 7.3.3 / AGP 7.2.0,
      # which requires a separate JDK 17 process. Keep the main Gradle daemon on JDK 21.
      - name: Configure JDK 17 for legacy Tooling API fixtures
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Select JDK 21 for Gradle and JDK 17 for legacy fixtures
        shell: bash
        run: |
          echo "ANDROIDIDE_TEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          java -version

      - name: Configure Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          # The Tooling API test fixture still targets compileSdk 31 and
          # explicitly requests Build Tools 31.0.0. Install both alongside
          # the app's API 37.1 toolchain so Robolectric/LSP integration tests
          # can build their isolated fixture project.
          "$SDKMANAGER" --install "platforms;android-31" "build-tools;31.0.0" "platforms;android-37.1" "build-tools;37.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1" "cmake;3.31.1"
          test -f "$ANDROID_HOME/platforms/android-31/android.jar"
          test -f "$ANDROID_HOME/build-tools/31.0.0/source.properties"
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          grep -F "Pkg.Revision = $NDK_VERSION" "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          test -f "$ANDROID_HOME/platforms/android-37.1/android.jar"

      - name: Configure SDK-managed CMake 3.31.1
        shell: bash
        run: |
          # CMake 3.31.1 was installed by sdkmanager in the preceding step.
          # Reuse that verified SDK package instead of downloading a second
          # 27 MB wheel from PyPI (which caused intermittent read timeouts).
          CMAKE_DIR="$ANDROID_HOME/cmake/3.31.1"
          test -x "$CMAKE_DIR/bin/cmake"
          "$CMAKE_DIR/bin/cmake" --version | tee /tmp/zerostudio-cmake-version.txt
          grep -F "cmake version 3.31.1" /tmp/zerostudio-cmake-version.txt
          echo "cmake.dir=$CMAKE_DIR" >> local.properties
          echo "$CMAKE_DIR/bin" >> "$GITHUB_PATH"
          protoc --version
          python3 --version

      - name: Build required native test dependencies
        run: |
          bash core/git/lib_build_scripts/build_native_libs.sh
          find core/git/src/main/jniLibs -name "*.so" -type f | sort

      - name: Grant wrapper execution permission
        id: prepare_test_environment
        run: chmod +x ./gradlew

      # Use Google's Maven Central mirror for CI test resolution. GitHub-hosted
      # runners can receive HTTP 429 from repo.maven.apache.org; rewrite only
      # Maven Central endpoints and keep every dependency/version unchanged.
      # Also allow Gradle 9.6 test tasks with no discoverable tests in legacy
      # modules to complete without treating that condition as a test failure.
      - name: Prepare resilient Gradle test configuration
        shell: bash
        run: |
          cat > ci-gradle-init.gradle <<'EOF'
          gradle.projectsEvaluated {
            allprojects {
              repositories.withType(org.gradle.api.artifacts.repositories.MavenArtifactRepository).configureEach {
                def repositoryUrl = url.toString()
                if (repositoryUrl == 'https://repo.maven.apache.org/maven2/' ||
                    repositoryUrl == 'https://repo1.maven.org/maven2/') {
                  url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
                }
              }
              tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                failOnNoDiscoveredTests = false
              }
            }
          }
          EOF

      # Keep each Gradle verification in its own step. This prevents a long
      # composite build from hiding the last completed task in one huge log.
      # continue-on-error lets the remaining suites run; the final gate below
      # still fails the job if any suite fails.
      - name: Run main project JVM unit tests and verification
        id: main_jvm_tests
        if: ${{ always() && steps.prepare_test_environment.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew -I ci-gradle-init.gradle --no-daemon --max-workers=2 --continue --stacktrace --console=plain testDebugUnitTest testReleaseUnitTest 2>&1 | tee ci-logs/main-jvm-tests.log

      - name: Run build-deps JVM tests and verification
        id: build_deps_tests
        if: ${{ always() && steps.prepare_test_environment.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew -I ci-gradle-init.gradle -p composite-builds/build-deps --no-daemon --max-workers=2 --continue --stacktrace --console=plain test 2>&1 | tee ci-logs/build-deps-tests.log

      - name: Run build-logic JVM tests and verification
        id: build_logic_tests
        if: ${{ always() && steps.prepare_test_environment.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew -I ci-gradle-init.gradle -p composite-builds/build-logic --no-daemon --max-workers=2 --continue --stacktrace --console=plain test 2>&1 | tee ci-logs/build-logic-tests.log

      - name: Run Android instrumentation tests
        id: instrumentation_tests
        if: ${{ always() && steps.prepare_test_environment.outcome == 'success' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # This runner image does not expose KVM to the emulator action.
          # Explicitly opt in to the emulator's supported TCG software mode.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p ci-logs
            set -o pipefail
            ./gradlew --no-daemon --max-workers=2 --continue --stacktrace --console=plain connectedCheck connectedDebugAndroidTest connectedReleaseAndroidTest 2>&1 | tee ci-logs/android-instrumentation-tests.log

      - name: Upload test reports and diagnostic logs
        id: upload_test_reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zerostudio-test-reports
          path: |
            ci-logs/**
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            **/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: warn
          retention-days: 14

      # This is the single authoritative failure gate. It runs after diagnostics
      # have been uploaded, so failures remain visible without suppressing later suites.
      - name: Summarize verification results
        if: always()
        env:
          MAIN_JVM_TESTS: ${{ steps.main_jvm_tests.outcome }}
          BUILD_DEPS_TESTS: ${{ steps.build_deps_tests.outcome }}
          BUILD_LOGIC_TESTS: ${{ steps.build_logic_tests.outcome }}
          INSTRUMENTATION_TESTS: ${{ steps.instrumentation_tests.outcome }}
        run: |
          status=0
          for entry in \
            "main JVM tests:$MAIN_JVM_TESTS" \
            "build-deps tests:$BUILD_DEPS_TESTS" \
            "build-logic tests:$BUILD_LOGIC_TESTS" \
            "Android instrumentation tests:$INSTRUMENTATION_TESTS"; do
            name="${entry%%:*}"
            outcome="${entry#*:}"
            echo "$name => $outcome"
            if [ "$outcome" != "success" ]; then
              echo "::error title=Verification failed::$name finished with outcome '$outcome'"
              status=1
            fi
          done
          exit "$status"
