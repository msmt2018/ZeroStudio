name: Build Android APK

on:
  push:
    branches:
      - fix/puppygit-native-ndk-ci
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose the compilation type (assembleDebug or assembleRelease)'
        required: true
        default: 'assemble'
        type: choice
        options:
          - assemble
          - assembleDebug
          - assembleRelease

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'assemble' }}
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      - name: Install basic system dependency packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip protobuf-compiler python3 python3-pip wget curl

      - name: Configure JDK 21 (Zulu 21.0.9)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Configuring a Gradle 9.8.0 environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install the specified NDK and Android SDK CMake (3.31.1)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          # API 37 is published as android-37.0; AGP 9.4.1 still resolves compileSdk=37 via android-37.
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;26.3.11579264" "ndk;29.0.14206865" "cmake;3.31.1"
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ] && [ ! -L "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          test -s "$ANDROID_HOME/platforms/android-37/android.jar"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt2"
          test -x "$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          test -x "$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          test -x "$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang"
          test -x "$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          test -x "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          test -x "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          test -x "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang"
          test -x "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"

      - name: Install higher CMake version (3.31.1) via pip
        run: |
          sudo pip3 install cmake==3.31.1 --break-system-packages
          CMAKE_DATA_DIR=$(python3 -c "import cmake, os; print(os.path.join(os.path.dirname(cmake.__file__), 'data'))")
          echo "cmake.dir=$CMAKE_DATA_DIR" >> local.properties

          cmake --version
          protoc --version
          python3 --version

      - name: Build puppygit native libs (libcrypto, libssl, libssh2, libgit2)
        env:
          # PuppyGit upstream native build uses NDK 26.3; Gradle modules use BuildConfig NDK 29.
          NDK_VERSION: "26.3.11579264"
        run: |
          bash core/git/lib_build_scripts/build_native_libs.sh
          echo "=== Built .so files ==="
          find core/git/src/main/jniLibs -name "*.so" -type f | sort

      - name: Grant execution permissions to the Gradle wrapper
        run: chmod +x ./gradlew

      - name: Compile APK
        env:
          # 限制 Gradle JVM 最大使用 5GB 内存，不开启守护进程以免内存驻留
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx5g -XX:MaxMetaspaceSize=1g' -Dorg.gradle.daemon=false"
          # 限制 CMake 底层的 Ninja 并发数为 2，防止 C++ 编译器吃光内存

          # export CMAKE_BUILD_PARALLEL_LEVEL=2
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          # 使用 --max-workers=2 限制模块并发
          gradle "$BUILD_TYPE" --build-cache --max-workers=2

      - name: Upload app-arm64-v8a-release.apk
        if: env.BUILD_TYPE == 'assembleRelease' || env.BUILD_TYPE == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release.apk
          path: core/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          compression-level: 0

      - name: Upload app-armeabi-v7a-release.apk
        if: env.BUILD_TYPE == 'assembleRelease' || env.BUILD_TYPE == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release.apk
          path: core/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          compression-level: 0

      - name: Upload app-x86_64-release.apk
        if: env.BUILD_TYPE == 'assembleRelease' || env.BUILD_TYPE == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release.apk
          path: core/app/build/outputs/apk/release/app-x86_64-release.apk
          compression-level: 0

      - name: Upload app-x86-release.apk
        if: env.BUILD_TYPE == 'assembleRelease' || env.BUILD_TYPE == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-x86-release.apk
          path: core/app/build/outputs/apk/release/app-x86-release.apk
          compression-level: 0

      - name: Upload app-arm64-v8a-debug.apk
        if: env.BUILD_TYPE == 'assembleDebug' || env.BUILD_TYPE == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug.apk
          path: core/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          compression-level: 0

      - name: Upload app-armeabi-v7a-debug.apk
        if: env.BUILD_TYPE == 'assembleDebug' || env.BUILD_TYPE == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-debug.apk
          path: core/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          compression-level: 0

      - name: Upload app-x86_64-debug.apk
        if: env.BUILD_TYPE == 'assembleDebug' || env.BUILD_TYPE == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-debug.apk
          path: core/app/build/outputs/apk/debug/app-x86_64-debug.apk
          compression-level: 0

      - name: Upload app-x86-debug.apk
        if: env.BUILD_TYPE == 'assembleDebug' || env.BUILD_TYPE == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: app-x86-debug.apk
          path: core/app/build/outputs/apk/debug/app-x86-debug.apk
          compression-level: 0
