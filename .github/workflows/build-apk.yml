name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Default APK build when no custom Gradle command is supplied'
        required: true
        default: 'assemble'
        type: choice
        options:
          - assemble
          - assembleDebug
          - assembleRelease
      gradle_command:
        description: 'Optional custom Gradle tasks and arguments (overrides build_type), e.g. :core:app:assembleDebug or :java:lsp:testDebugUnitTest --tests com.example.MyTest'
        required: false
        default: ''
        type: string
      verification_gradle_command:
        description: 'Optional exact Gradle task(s) to run in the tests job instead of the full verification suite, e.g. :core:git:lintDebug'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NDK_VERSION: "29.0.14206865"

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install basic system dependency packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip protobuf-compiler python3 python3-pip wget curl

      - name: Configure JDK 21 (Zulu 21.0.9)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Configuring a Gradle 9.6.0 environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version

      - name: Verify Bun
        run: |
          which bun
          bun --version

      - name: Install web-ui dependencies with Bun
        working-directory: core/chatai/web-ui
        run: |
          bun install --frozen-lockfile

      - name: Install NDK r29 and Android SDK CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses

          # Install the canonical Android API 37 platform package.
          "$SDKMANAGER" --install "platforms;android-37.1" "build-tools;37.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1" "cmake;3.31.1"

          # Install API 37.1 for the app and colorpicker AAR metadata requirement; retain 37.0 for base API modules.

          # Fail immediately if the requested NDK revision was not installed exactly.
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          grep -F "Pkg.Revision = $NDK_VERSION" "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"


          echo "=== Installed Android SDK platforms ==="
          ls -la "$ANDROID_HOME/platforms"
          test -f "$ANDROID_HOME/platforms/android-37.1/android.jar"

      - name: Install CMake 3.31.1 via pip
        run: |
          sudo pip3 install cmake==3.31.1 --break-system-packages
          CMAKE_DATA_DIR=$(python3 -c "import cmake, os; print(os.path.join(os.path.dirname(cmake.__file__), 'data'))")
          echo "cmake.dir=$CMAKE_DATA_DIR" >> local.properties

          cmake --version
          protoc --version
          python3 --version

      - name: Build puppygit native libs (libcrypto, libssl, libssh2, libgit2)
        run: |
          bash core/git/lib_build_scripts/build_native_libs.sh
          echo "=== Built .so files ==="
          find core/git/src/main/jniLibs -name "*.so" -type f | sort

      - name: Grant execution permissions to the Gradle wrapper
        run: chmod +x ./gradlew

      - name: Compile APK
        env:
          # APK CI 不生成 Nyx 发布版本元数据；跳过 Nyx 插件，避免 Maven Central 限流导致构建中断
          ZEROSTUDIO_SKIP_NYX: "true"
          # 限制 Gradle JVM 最大使用 5GB 内存，不开启守护进程以免内存驻留
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx5g -XX:MaxMetaspaceSize=1g' -Dorg.gradle.daemon=false"
          # 限制 CMake 底层的 Ninja 并发数为 2，防止 C++ 编译器吃光内存

          # export CMAKE_BUILD_PARALLEL_LEVEL=2
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          # Read workflow_dispatch input through the environment, never interpolate
          # user text directly into the shell script.
          CUSTOM_GRADLE_COMMAND: ${{ inputs.gradle_command }}
          BUILD_TYPE: ${{ inputs.build_type || 'assemble' }}
        run: |
          # Keep the full Gradle output for post-failure diagnosis.
          set -o pipefail
          if [[ -n "${CUSTOM_GRADLE_COMMAND//[[:space:]]/}" ]]; then
            # Accept a whitespace-separated Gradle task/argument list. This is
            # intentionally a Gradle command field, not an arbitrary shell script.
            read -r -a GRADLE_ARGS <<< "$CUSTOM_GRADLE_COMMAND"
            if [[ ${#GRADLE_ARGS[@]} -eq 0 ]]; then
              echo "Custom Gradle command contains no tasks or arguments." >&2
              exit 2
            fi
            echo "Running custom Gradle command: ${GRADLE_ARGS[*]}"
          else
            GRADLE_ARGS=("$BUILD_TYPE")
            echo "Running default APK build type: $BUILD_TYPE"
          fi
          ./gradlew "${GRADLE_ARGS[@]}" --build-cache --max-workers=2 --console=plain 2>&1 | tee build-apk-gradle.log

      - name: Upload APK build diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-diagnostic-log
          path: build-apk-gradle.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload app-arm64-v8a-release.apk
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.gradle_command == '' && (inputs.build_type == 'assembleRelease' || inputs.build_type == 'assemble'))
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release.apk
          path: core/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          compression-level: 0

      - name: Upload app-armeabi-v7a-release.apk
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.gradle_command == '' && (inputs.build_type == 'assembleRelease' || inputs.build_type == 'assemble'))
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release.apk
          path: core/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          compression-level: 0

      - name: Upload app-x86_64-release.apk
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.gradle_command == '' && (inputs.build_type == 'assembleRelease' || inputs.build_type == 'assemble'))
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release.apk
          path: core/app/build/outputs/apk/release/app-x86_64-release.apk
          compression-level: 0

      - name: Upload app-arm64-v8a-debug.apk
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.gradle_command == '' && (inputs.build_type == 'assembleDebug' || inputs.build_type == 'assemble'))
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug.apk
          path: core/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          compression-level: 0

      - name: Upload app-armeabi-v7a-debug.apk
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.gradle_command == '' && (inputs.build_type == 'assembleDebug' || inputs.build_type == 'assemble'))
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-debug.apk
          path: core/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          compression-level: 0

      - name: Upload app-x86_64-debug.apk
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.gradle_command == '' && (inputs.build_type == 'assembleDebug' || inputs.build_type == 'assemble'))
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-debug.apk
          path: core/app/build/outputs/apk/debug/app-x86_64-debug.apk
          compression-level: 0

  # Verification is a separate job node and starts only after the APK job succeeds.
  # A custom workflow_dispatch Gradle command is a focused task run. Do not
  # follow it with the repository-wide verification suite.
  tests:
    if: github.event_name != 'workflow_dispatch' || inputs.gradle_command == ''
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NDK_VERSION: "29.0.14206865"
      ZEROSTUDIO_SKIP_NYX: "true"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx5g -XX:MaxMetaspaceSize=1g' -Dorg.gradle.daemon=false"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - name: Checkout the exact commit that produced the APK
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Install basic system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip protobuf-compiler python3 python3-pip wget curl

      # Run the repository build and lint tasks on the same JDK as the APK job.
      - name: Configure JDK 21 for project tests
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      # The Tooling API compatibility fixture launches Gradle 7.3.3 / AGP 7.2.0,
      # which requires a separate JDK 17 process. Keep the main Gradle daemon on JDK 21.
      - name: Configure JDK 17 for legacy Tooling API fixtures
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Select JDK 21 for Gradle and JDK 17 for legacy fixtures
        shell: bash
        run: |
          echo "ANDROIDIDE_TEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          java -version

      - name: Configure Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      # :core:chatai:web:buildWebUi invokes pnpm from its Gradle Exec task.
      # The tests job must provision the same Node toolchain and lockfile-based
      # dependencies as the APK job before running project-wide Gradle checks.
      - name: Setup Node.js for web-ui Gradle tasks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm for web-ui Gradle tasks
        run: |
          npm install --global pnpm
          pnpm --version

      - name: Install web-ui dependencies for Gradle verification
        working-directory: core/chatai/web-ui
        run: pnpm install --frozen-lockfile

      - name: Install Android SDK, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-37.1" "build-tools;37.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1" "cmake;3.31.1"
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          grep -F "Pkg.Revision = $NDK_VERSION" "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          test -f "$ANDROID_HOME/platforms/android-37.1/android.jar"

      - name: Install CMake 3.31.1 via pip
        run: |
          sudo pip3 install cmake==3.31.1 --break-system-packages
          CMAKE_DATA_DIR=$(python3 -c "import cmake, os; print(os.path.join(os.path.dirname(cmake.__file__), 'data'))")
          echo "cmake.dir=$CMAKE_DATA_DIR" >> local.properties
          cmake --version
          protoc --version
          python3 --version

      - name: Build required native test dependencies
        run: |
          bash core/git/lib_build_scripts/build_native_libs.sh
          find core/git/src/main/jniLibs -name "*.so" -type f | sort

      - name: Grant wrapper execution permission
        run: chmod +x ./gradlew

      - name: Run JVM unit tests and Gradle verification
        env:
          VERIFICATION_GRADLE_COMMAND: ${{ inputs.verification_gradle_command }}
        run: |
          set -o pipefail
          if [[ -n "${VERIFICATION_GRADLE_COMMAND//[[:space:]]/}" ]]; then
            read -r -a GRADLE_ARGS <<< "$VERIFICATION_GRADLE_COMMAND"
            if [[ ${#GRADLE_ARGS[@]} -eq 0 ]]; then
              echo "Custom verification Gradle command contains no tasks or arguments." >&2
              exit 2
            fi
            echo "Running selected verification Gradle command: ${GRADLE_ARGS[*]}"
            ./gradlew "${GRADLE_ARGS[@]}" --no-daemon --max-workers=2 --console=plain
          else
            set +e
            status=0
            run_gradle() {
              echo "::group::Running: $*"
              "$@"
              result=$?
              echo "::endgroup::"
              if [ "$result" -ne 0 ]; then status=1; fi
            }
            # The lifecycle 'check' task already includes the applicable unit-test and
            # lint verification tasks. Do not list 'test' and variant-specific test
            # tasks again: that schedules the same test suites multiple times.
            run_gradle ./gradlew --no-daemon --max-workers=2 --continue --stacktrace check
            run_gradle ./gradlew -p composite-builds/build-deps --no-daemon --max-workers=2 --continue --stacktrace check
            run_gradle ./gradlew -p composite-builds/build-logic --no-daemon --max-workers=2 --continue --stacktrace check
            exit "$status"
          fi

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            status=0
            run_gradle() {
              echo "::group::Instrumentation: $*"
              "$@"
              result=$?
              echo "::endgroup::"
              if [ "$result" -ne 0 ]; then status=1; fi
            }
            # Instrumentation tests belong to the main Android application build.
            # build-deps is a dependency composite build, not a second app test target.
            run_gradle ./gradlew --no-daemon --max-workers=2 --continue connectedCheck connectedDebugAndroidTest connectedReleaseAndroidTest
            exit "$status"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zerostudio-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/reports/androidTests/**
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.sarif
            **/build/intermediates/lint_intermediate_text_report/**
            **/build/outputs/androidTest-results/**
            **/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: warn
          retention-days: 14
