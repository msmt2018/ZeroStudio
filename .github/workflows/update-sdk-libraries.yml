name: Update SDK Libraries

on:
  push:
    branches: [main]
    paths:
      - renovate.json
      - gradle/libs.versions.toml
  schedule:
    # Weekly dependency discovery; Renovate opens reviewable PRs.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: update-sdk-libraries
  cancel-in-progress: false

jobs:
  renovate:
    name: Check Gradle SDK Library updates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Renovate for the central Gradle version catalog
        uses: renovatebot/github-action@v46.3.14
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BASE_BRANCHES: main
