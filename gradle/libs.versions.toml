# Root shell (libsu) —— 设备连接管理 BottomSheet 的 Root 通道探测/执行用,
# 跟 debugger/android-adb-shell 参考工程保持一致 (6.0.0)。
libsu = "6.0.0"

# ADB 连接管理 —— libadb 模块需要的加密/配对依赖
# - bcprov-jdk15to18: BouncyCastle, TLS 加密用
# - spake2-android: SPAKE2 配对协议 (WiFi ADB Pairing)
# - sun-security-android: sun.security 替代实现 (libadb 需要)
bcprov-jdk15to18 = "1.85"
spake2-android = "-SNAPSHOT"
sun-security-android = "1.1"

# root/build.gradle.kts > plugins || Classpaths
