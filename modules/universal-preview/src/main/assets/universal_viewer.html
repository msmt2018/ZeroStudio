<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!--
    universal_viewer.html — Web 核前端
    职责:
      1. 响应式 Canvas 自适应屏幕尺寸 (含屏幕旋转)
      2. Three.js 初始化 3D 场景 (相机 / 灯光 / 渲染器)
      3. 接收 Java 层 JSON 数据 (window.AndroidIDE 桥 + updateScene)
         → 解析为 3D 节点立体绘制 (AST 拓扑 / 调用图 / 数据流)

    极端场景:
      - 屏幕旋转: ResizeObserver 监听 canvas 尺寸变化, 更新 camera aspect + renderer
      - 快速切换标签页: document.visibilitychange 暂停 / 恢复 requestAnimationFrame
      - JSON 格式错误: try-catch 包裹 JSON.parse, 失败通知 Java onError()
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      /* 阻止触摸手势缩放 (3D 场景自己处理手势) */
      touch-action: none;
    }
    #canvas-container {
      width: 100%; height: 100%;
      position: relative;
    }
    canvas { display: block; }
    /* 加载提示 */
    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #e0e0e0; font-family: monospace; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div id="loading">正在初始化 Three.js 渲染引擎...</div>
  </div>

  <!-- Three.js (从 CDN 加载; 离线时可替换为本地 assets/three.min.js) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
  (function () {
    'use strict';

    // ── 全局状态 ──────────────────────────────────────────
    var renderer, scene, camera, container;
    var loadingEl = document.getElementById('loading');
    var nodeGroup; // AST / 拓扑节点 3D 组
    var animationId = null;

    // ── 1. 初始化 Three.js ────────────────────────────────
    function initThree() {
      container = document.getElementById('canvas-container');

      // 渲染器
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,           // 透明背景, 叠加在 #1a1a2e 上
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      // 场景
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a2e);

      // 透视相机
      var aspect = container.clientWidth / container.clientHeight;
      camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 1000);
      camera.position.set(0, 0, 15);

      // 灯光 (环境光 + 方向光)
      scene.add(new THREE.AmbientLight(0xffffff, 0.4));
      var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // 节点组 (AST / 拓扑节点将添加到这里)
      nodeGroup = new THREE.Group();
      scene.add(nodeGroup);

      // 加载提示淡出
      loadingEl.style.display = 'none';

      // 通知 Java 层场景就绪
      if (window.AndroidIDE && window.AndroidIDE.onSceneReady) {
        window.AndroidIDE.onSceneReady();
      }

      console.log('[UniversalViewer] Three.js 初始化完成');
    }

    // ── 2. 响应式 Canvas 自适应 ───────────────────────────
    // 用 ResizeObserver 监听容器尺寸变化 (屏幕旋转 / 窗口缩放)
    function onResize() {
      if (!renderer || !camera || !container) return;
      var w = container.clientWidth;
      var h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      console.log('[UniversalViewer] resize → ' + w + 'x' + h);
    }

    // ── 3. 渲染循环 ───────────────────────────────────────
    function animate() {
      animationId = requestAnimationFrame(animate);

      // 节点组缓慢旋转 (展示 3D 立体效果)
      if (nodeGroup) {
        nodeGroup.rotation.y += 0.005;
      }

      renderer.render(scene, camera);

      // 如果有 WASM 模块, 调用其 render 函数 (方案 3)
      if (window.__wasmRender) {
        try { window.__wasmRender(); } catch (e) {
          console.error('[WASM] render 失败: ' + e.message);
          window.__wasmRender = null; // 停止重试
        }
      }
    }

    // ── 4. 接收 Java 层 JSON 数据, 构建 3D 节点 ──────────
    // Java 端通过 evaluateJavascript 调用:
    //   window.__universalViewer.updateScene(jsonString)
    //
    // 数据格式支持:
    //   { "type": "ast",         "nodes": [...], "edges": [...] }  — AST 拓扑
    //   { "type": "topology",    "nodes": [...], "edges": [...] }  — 调用图
    //   { "type": "source",      "source": "...", "file": "..." }  — 源码文本
    //   { "type": "wasm_module", "url": "file:///.../module.wasm" } — WASM 模块
    window.__universalViewer = {
      updateScene: function (jsonStr) {
        try {
          var data = JSON.parse(jsonStr);
          if (data.type === 'wasm_module') {
            // ── 方案 3: WebAssembly 模块加载 ──
            // C++ 源码 → LLVM 编译 → .wasm → WebView 沙盒执行
            // WebView 的 WebSettings 已启用 JavaScript + WebGL2,
            // 可以安全地在沙盒内运行用户编译的 WASM 模块。
            loadWasmModule(data.url);
          } else if (data.type === 'source') {
            // ── 源码文本 → 简易语法高亮 3D 节点 ──
            buildSourceNodes(data.source, data.file);
          } else {
            // ── AST / 拓扑 / 数据流 JSON ──
            buildSceneFromData(data);
          }
          if (window.AndroidIDE && window.AndroidIDE.log) {
            window.AndroidIDE.log('[Web] 场景已更新, type=' + (data.type || 'ast'));
          }
        } catch (e) {
          console.error('[UniversalViewer] JSON 解析失败: ' + e.message);
          if (window.AndroidIDE && window.AndroidIDE.onError) {
            window.AndroidIDE.onError('JSON 解析失败: ' + e.message);
          }
        }
      }
    };

    // ── 5a. 加载 WebAssembly 模块 (方案 3) ──────────────────
    // 流程: C++ 源码 → LLVM/emscripten → .wasm → WebView → WebGL 渲染
    // 优势: .wasm 运行在 WebView 沙盒内, 对安卓系统无安全威胁
    // 限制: 手机端无内置 LLVM, 需预编译或远程编译 .wasm
    function loadWasmModule(url) {
      console.log('[UniversalViewer] 加载 WASM 模块: ' + url);
      fetch(url)
        .then(function (response) { return response.arrayBuffer(); })
        .then(function (bytes) {
          return WebAssembly.instantiate(bytes, {
            env: {
              // 提供 WebGL 绘图 API 给 WASM 模块
              glClear: function (mask) { gl.clear(mask); },
              glClearColor: function (r, g, b, a) { gl.clearColor(r, g, b, a); },
              // ... 更多 GL 函数按需暴露
              __sys_log: function (ptr) {
                console.log('[WASM] ' + ptr);
              }
            }
          });
        })
        .then(function (result) {
          var exports = result.instance.exports;
          console.log('[UniversalViewer] WASM 模块已加载, exports: ' + Object.keys(exports));
          if (exports.init) exports.init();
          if (exports.render) {
            // 注册到渲染循环
            window.__wasmRender = exports.render;
          }
          if (window.AndroidIDE && window.AndroidIDE.log) {
            window.AndroidIDE.log('[Web] WASM 模块加载成功');
          }
        })
        .catch(function (e) {
          console.error('[UniversalViewer] WASM 加载失败: ' + e.message);
          if (window.AndroidIDE && window.AndroidIDE.onError) {
            window.AndroidIDE.onError('WASM 加载失败: ' + e.message);
          }
        });
    }

    // ── 5b. 源码文本 → 3D 节点 (简易语法树可视化) ──────────
    function buildSourceNodes(source, fileName) {
      // 清空旧节点
      while (nodeGroup.children.length > 0) {
        var child = nodeGroup.children[0];
        nodeGroup.remove(child);
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      }

      // 按行分割, 每行一个节点, 按缩进层级决定 Z 轴深度
      var lines = source.split('\n');
      var colors = ['#4CAF50', '#2196F3', '#FF9800', '#9C27B0', '#F44336'];
      var maxLines = Math.min(lines.length, 200); // 限制节点数

      for (var i = 0; i < maxLines; i++) {
        var line = lines[i];
        var indent = line.length - line.trimStart().length;
        var trimmed = line.trim();
        if (trimmed.length === 0) continue;

        var geometry = new THREE.BoxGeometry(2, 0.3, 0.3);
        var colorIdx = indent % colors.length;
        var material = new THREE.MeshPhongMaterial({
          color: colors[colorIdx],
          shininess: 30
        });
        var mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(indent * 0.5 - (i % 10), -i * 0.5, -indent * 0.3);
        nodeGroup.add(mesh);
      }

      // 居中相机
      if (nodeGroup.children.length > 0) {
        var box = new THREE.Box3().setFromObject(nodeGroup);
        var center = box.getCenter(new THREE.Vector3());
        var size = box.getSize(new THREE.Vector3());
        var maxDim = Math.max(size.x, size.y, size.z, 1);
        camera.position.set(center.x, center.y, center.z + maxDim * 3);
        camera.lookAt(center);
      }
    }

    // ── 5. 根据 JSON 数据构建 3D 节点立体绘制 ─────────────
    //
    // JSON 数据格式 (示例):
    // {
    //   "type": "ast" | "topology" | "dataflow",
    //   "nodes": [
    //     { "id": "func_main", "label": "main()", "x": 0, "y": 0, "z": 0,
    //       "color": "#4CAF50", "size": 1.0 },
    //     ...
    //   ],
    //   "edges": [
    //     { "from": "func_main", "to": "func_parse" },
    //     ...
    //   ]
    // }
    function buildSceneFromData(data) {
      // 清空旧节点
      while (nodeGroup.children.length > 0) {
        var child = nodeGroup.children[0];
        nodeGroup.remove(child);
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      }

      if (!data || !data.nodes) return;

      // 绘制节点 (球体)
      var nodeMap = {};
      data.nodes.forEach(function (node) {
        var geometry = new THREE.SphereGeometry(
          (node.size || 1.0) * 0.5, 24, 24
        );
        var material = new THREE.MeshPhongMaterial({
          color: node.color || '#4CAF50',
          shininess: 60
        });
        var mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(
          node.x || 0,
          node.y || 0,
          node.z || 0
        );
        mesh.userData = { id: node.id, label: node.label };
        nodeGroup.add(mesh);
        nodeMap[node.id] = mesh;
      });

      // 绘制边 (连线)
      if (data.edges) {
        data.edges.forEach(function (edge) {
          var fromMesh = nodeMap[edge.from];
          var toMesh = nodeMap[edge.to];
          if (!fromMesh || !toMesh) return;

          var points = [fromMesh.position, toMesh.position];
          var geometry = new THREE.BufferGeometry().setFromPoints(points);
          var material = new THREE.LineBasicMaterial({
            color: 0x6a6a8e, transparent: true, opacity: 0.5
          });
          var line = new THREE.Line(geometry, material);
          nodeGroup.add(line);
        });
      }

      // 居中相机 (根据节点包围盒)
      if (data.nodes.length > 0) {
        var box = new THREE.Box3().setFromObject(nodeGroup);
        var center = box.getCenter(new THREE.Vector3());
        var size = box.getSize(new THREE.Vector3());
        var maxDim = Math.max(size.x, size.y, size.z, 1);
        camera.position.set(center.x, center.y, center.z + maxDim * 3);
        camera.lookAt(center);
      }
    }

    // ── 6. 可见性管理 (快速切换标签页时暂停渲染) ──────────
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
        console.log('[UniversalViewer] 页面隐藏, 暂停渲染');
      } else {
        if (!animationId) {
          animate();
        }
        console.log('[UniversalViewer] 页面恢复, 继续渲染');
      }
    });

    // ── 7. 启动 ───────────────────────────────────────────
    function start() {
      if (typeof THREE === 'undefined') {
        // CDN 加载失败: 通知 Java 并重试 (离线场景应预置本地 three.min.js)
        loadingEl.textContent = 'Three.js 加载失败, 请检查网络';
        if (window.AndroidIDE && window.AndroidIDE.onError) {
          window.AndroidIDE.onError('Three.js CDN 加载失败');
        }
        // 5 秒后重试
        setTimeout(start, 5000);
        return;
      }
      initThree();
      onResize();
      animate();
    }

    // ResizeObserver (现代浏览器; 旧 WebView 回退到 window.resize)
    if (typeof ResizeObserver !== 'undefined') {
      var ro = new ResizeObserver(onResize);
      ro.observe(document.getElementById('canvas-container'));
    } else {
      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', function () {
        setTimeout(onResize, 300); // 等旋转动画完成
      });
    }

    // DOM 就绪后启动
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
  </script>
</body>
</html>
